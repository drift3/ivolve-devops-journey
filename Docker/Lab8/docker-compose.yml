
services:
  
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ivolve
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - ivolve-net

  app:
    build: .
    container_name: node_app
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_USER: appuser
      DB_PASSWORD: apppassword
      DB_NAME: ivolve
      DB_PORT: 3306
    volumes:
      - app_logs:/app/logs
    networks:
      - ivolve-net
    depends_on:
      - db

volumes:
  db_data:
  app_logs:

networks:
  ivolve-net:
    driver: bridge
